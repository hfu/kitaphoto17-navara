<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>kitaphoto17 on Navara</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(20, 24, 28, 0.82);
        color: #e6e9ee;
        font: 14px/1.4 system-ui, sans-serif;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      }
      #panel.collapsed #panel-label {
        display: none;
      }
      #panel-toggle {
        border: none;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        padding: 0 4px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <span id="panel-label">Welcome to Hokkaido, Navara!</span>
      <button id="panel-toggle" aria-label="toggle panel" type="button">−</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
